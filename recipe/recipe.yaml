schema_version: 1

context:
  version: "0.2.0"

package:
  name: streamflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamflow/streamflow-${{ version }}.tar.gz
  sha256: cc2d3eed5dbf3a83ca052d59c91b2da8b8e5cd6642aded7ae3b9f7f5d5748091

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - streamflow=streamflow.main:run
      - cwl-runner=streamflow.cwl.runner:run

requirements:
  host:
    - python =${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - aiohttp
    - aiosqlite
    - antlr4-python3-runtime =4.13.2
    - asyncssh =2.24.1
    - bcrypt
    - cachebox
    - cachetools
    - cwltool
    - jinja2
    - jsonref
    - jsonschema
    - kubernetes_asyncio >=22.6.2
    - mslex
    - pandas
    - yattag

tests:
  - python:
      imports:
        - streamflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - streamflow --help
      - cwl-runner --help

about:
  summary: StreamFlow framework
  license: LGPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/alpha-unito/streamflow

extra:
  recipe-maintainers:
    - jan-janssen
